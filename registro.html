<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CepKit - Registro</title>
    <link rel="stylesheet" href="CSS/estilos.css">
</head>
<body>
    <main class="contenedor-global">
        <section class="panel-derecha">
            <div class="formulario">
                <h2>CepKit</h2>
                <form action="">
                    <label for="nombres">Nombres:</label>
                    <input type="text" id="nombres" required>

                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" required>

                    <label for="genero">Género:</label>
                    <select id="genero" name="genero">
                        <option value="">Seleccionar</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Masculino">Masculino</option>
                    </select>

                    <label for="nacimiento">Fecha Nacimiento:</label>
                    <input type="date" id="nacimiento" required>

                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required>

                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required>

                    <p>¿Ya tienes una cuenta? <a href="index.html">Ingresar</a></p>

                    <div class="botones">
                        <input type="submit" value="Registrarse">
                    </div>
                </form>
            </div>
        </section>
        <section class="panel-izquierda"></section>
    </main>
</body>
</html>
